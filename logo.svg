<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 上海城市智能体 · S：黑底圆角 + 细网格 + 青色 S（像一条河 / 一条路）+ 正中一个橙色节点（地点）-->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a26"/><stop offset="1" stop-color="#05070a"/></linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <path id="s" d="M45.5 20.5C43 15.5 37.5 13.5 31.5 13.5C24 13.5 19.5 17.5 19.5 23C19.5 29.5 26 31 32 32.5C38.5 34 45 36 45 42.5C45 48 40 51 32.5 51C26 51 21 48.5 18.5 43.5"
          fill="none" stroke="#7cc8ff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#tile)" stroke="#7cc8ff" stroke-width=".5" opacity=".16">
    <path d="M17 0V64M32 0V64M47 0V64M0 17H64M0 32H64M0 47H64"/>
  </g>
  <!-- 雷达探测范围：以节点为圆心的虚线圈（外圈罩住整个 S，内圈更淡）+ 外圈四个方位刻度 -->
  <g fill="none" stroke="#7cc8ff" stroke-linecap="round">
    <circle cx="32" cy="32.4" r="24.5" stroke-width="1.3" stroke-dasharray="3.2 2.6" opacity=".75"/>
    <circle cx="32" cy="32.4" r="12.5" stroke-width="1" stroke-dasharray="2.2 2.2" opacity=".38"/>
    <path d="M32 5.4V9M32 55.8V59.4M5 32.4H8.6M55.4 32.4H59" stroke-width="1.4" opacity=".75"/>
  </g>
  <use href="#s" filter="url(#glow)" opacity=".6"/>
  <use href="#s"/>
  <circle cx="32" cy="32.4" r="6" fill="#ff6a1a" opacity=".45" filter="url(#glow)"/>
  <circle cx="32" cy="32.4" r="4" fill="#ff6a1a" stroke="#05070a" stroke-width="1.2"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#7cc8ff" stroke-opacity=".28"/>
</svg>
